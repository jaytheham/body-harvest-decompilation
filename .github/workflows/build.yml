name: build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  # Every script in tests/ on every pull request and push. They need no ROM, so a fork's pull request runs them too. The loop
  # takes whatever is in tests/*.sh, so a new test needs no workflow change, and it keeps going after a failure so one run
  # shows every broken script. 3.10 is the Python of ubuntu-22.04 and 3.12 the newest the vendored tree-sitter has a build
  # for (tools/third_party/python_vendor has none for 3.11), so the two ends of what tools/progress.py can run on are both tried.
  tests:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/progress_eu_check.sh walks the git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies the tests use
        run: pip install pyyaml

      - name: Run every test in tests/
        run: |
          status=0
          for t in tests/*.sh; do
            echo "::group::$t"
            PY=python bash "$t" || { echo "::error::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        version: [us, eu]

    env:
      # US keeps the bare build directory; every other version builds into build.<version> (see the Makefile).
      BUILD_DIR: ${{ matrix.version == 'us' && 'build' || format('build.{0}', matrix.version) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch ROM from private assets repo
        env:
          ROM_PAT: ${{ secrets.BH_ROM_ASSETS_PAT }}
        run: |
          if [ -n "$ROM_PAT" ]; then
            git clone --depth 1 "https://x-access-token:${ROM_PAT}@github.com/Meridian-Lex/bh-rom-assets.git" rom-assets
            cp rom-assets/baserom.${{ matrix.version }}.z64 baserom.${{ matrix.version }}.z64
            echo "ROM_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "::warning::BH_ROM_ASSETS_PAT not set - skipping ROM fetch and build verification (pull requests from forks never receive it)"
            echo "ROM_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat packages.txt | tr '\n' ' ')

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Extract ROM
        if: env.ROM_AVAILABLE == 'true'
        run: make extract VERSION=${{ matrix.version }}

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('src/**', 'src.*/**', 'include/**', 'asm/**', 'asm.*/**', 'assets/**', 'assets.*/**', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.version }}-

      - name: Build and verify ROM
        if: env.ROM_AVAILABLE == 'true'
        run: make --jobs VERSION=${{ matrix.version }}

      - name: Check function symbol sizes
        if: env.ROM_AVAILABLE == 'true'
        run: python3 tools/check_elf_symbols.py build/bh.${{ matrix.version }}.elf

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-${{ matrix.version }}
          path: |
            ${{ env.BUILD_DIR }}/bh.${{ matrix.version }}.map
            undefined_syms_auto*.txt

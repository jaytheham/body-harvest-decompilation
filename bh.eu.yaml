sha1: 67750E2E7AB46FEDF65A271AB7F4C7AAD92AE355
options:
  platform: n64
  basename: bh
  target_path: baserom.eu.z64
  base_path: .
  disassemble_all: yes
  matchings_path: matchings
  symbol_addrs_path: symbol_addrs.eu.txt
  ld_symbol_header_path: include/ld_symbols.eu.h
  ld_script_path: bh.eu.ld
  undefined_syms_auto_path: undefined_syms_auto.eu.txt
  generated_c_preamble: |
    #include <ultra64.h>
    #include "common.h"
  src_path: src.eu
  asm_path: asm.eu
  asset_path: assets.eu
  build_path: build.eu
  extensions_path: tools/splat_ext
  lib_path: build/lib
  migrate_rodata_to_functions: no
  # workaround regex issue
  create_undefined_funcs_auto: no
  symbol_name_format: $VRAM_$ROM
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  image_type_in_extension: yes
  segment_symbols_style: makerom
segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: core
    type: code
    start: 0x1000
    vram: 0x80000400

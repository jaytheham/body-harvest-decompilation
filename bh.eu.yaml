      - [0xAD90, c, ../src.us/core/AD60] # Text rendering?
      - [0xE860, c, ../src.us/core/E830]
      - [0xFB30, c, ../src.us/core/FD80] # Boot and scheduler share epilogue alignment.
      - [0x10A80, c, ../src.us/core/10A20]
      - [0x10BF0, c, ../src.us/core/loader] # original src filename
      - [0x12CB0, c, ../src.us/core/12C80] # Sounds, Dialogue
      - [0x17F10, c, ../src.us/core/17EE0] # Dialogue
